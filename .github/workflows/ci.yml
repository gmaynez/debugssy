name: CI

on:
  push:
    branches:
      - main # Production/release branch
      - develop # Development branch
      - "feature/**" # Feature branches
      - "fix/**" # Bug fix branches
  # Note: PRs are handled by pr-validation.yml to avoid duplicate runs

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Type check
        run: npm run check-types

      - name: Run unit tests
        run: npm test

      - name: Build (esbuild)
        run: npm run compile

      - name: Package extension
        run: npm run package

      - name: Upload build artifacts (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: debugssy-build
          path: |
            out/extension.js
            *.vsix
          retention-days: 7

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Run npm audit
        run: npm audit --production --audit-level=moderate

      - name: Check for outdated dependencies
        run: npm outdated || true

  test-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Display coverage summary
        run: |
          echo "📊 Test Coverage Summary:"
          if [ -f coverage/coverage-summary.json ]; then
            echo ""
            node -e "
              const summary = require('./coverage/coverage-summary.json');
              const total = summary.total;
              console.log('Lines:      ' + total.lines.pct + '%');
              console.log('Statements: ' + total.statements.pct + '%');
              console.log('Functions:  ' + total.functions.pct + '%');
              console.log('Branches:   ' + total.branches.pct + '%');
            "
          else
            echo "❌ Coverage summary file not found"
            exit 1
          fi

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Count lines of code
        run: |
          echo "📊 Code Statistics:"
          echo "Total TypeScript files:"
          find src -name "*.ts" | wc -l
          echo "Total lines of code:"
          find src -name "*.ts" -exec wc -l {} + | tail -1
